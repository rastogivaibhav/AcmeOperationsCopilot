name: Acme Copilot Live Compose Integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integration.yml'
      - 'compose.yaml'
      - 'database/init_keycloak.py'
      - 'infrastructure/keycloak/acme-realm.json'
      - 'app/agent/**'
      - 'app/skills/**'
      - 'evals/**'
      - 'tests/test_agent_grounding_recovery.py'
permissions:
  contents: read
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OLLAMA_MODEL: qwen2.5:3b
    steps:
      - uses: actions/checkout@v4
      - name: Build and start full assessment stack
        run: docker compose up --build -d
      - name: Diagnose startup failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=250 keycloak db-init model-init
      - name: Confirm container health and readiness
        run: |
          docker compose ps
          curl --fail --show-error --retry 45 --retry-all-errors --retry-delay 4 --max-time 8 http://127.0.0.1:8000/readyz
      - name: Inspect JWT validation metadata (never emit tokens)
        run: |
          docker compose exec -T web python - <<'PY'
          import os
          import jwt
          from app.smoke import acquire
          from acme_shared.security import verify_keycloak_jwt
          from acme_shared.policies import effective_role, principal_from_claims
          token = acquire("sales-demo", "SalesLocal2026!")
          untrusted = jwt.decode(token, options={"verify_signature": False})
          print("JWT_METADATA", {
              "iss": untrusted.get("iss"),
              "aud": untrusted.get("aud"),
              "realm_role_names": untrusted.get("realm_access", {}).get("roles", []),
              "has_kid": bool(jwt.get_unverified_header(token).get("kid")),
              "expected_issuer": os.environ.get("KEYCLOAK_ISSUER"),
          })
          try:
              verified = verify_keycloak_jwt(token, audience="acme-web")
              print("JWT_VERIFIED_ROLE", effective_role(principal_from_claims(verified)))
          except Exception as exc:
              print("JWT_VALIDATION_ERROR", type(exc).__name__, str(exc))
          PY
      - name: Authentication and MCP foundation tests
        run: |
          docker compose exec -T web python -m app.smoke
          docker compose exec -T web python -m app.smoke_w06
      - name: Controlled business write integration
        run: docker compose exec -T web python -m app.smoke_w10
      - name: Observability integration
        run: docker compose exec -T web python -m app.telemetry.smoke_w11
      # Keep each live score independent; do not hide failures or block later
      # diagnostic suites just because the local model misses an earlier case.
      - name: W07 model and MCP tool-routing evaluation
        id: w07
        continue-on-error: true
        run: docker compose exec -T web python -m app.agent.probe
      - name: W08 LangGraph execution smoke
        id: w08
        continue-on-error: true
        run: docker compose exec -T web python -m app.agent.smoke_w08
      - name: W09 escalation Skill smoke
        id: w09
        continue-on-error: true
        run: docker compose exec -T web python -m app.skills.smoke_w09
      - name: Ten-question W13 agent evaluation
        id: w13
        continue-on-error: true
        run: docker compose exec -T web python -m evals.run_w13
      - name: Enforce all independent agent gates
        if: always()
        env:
          W07_RESULT: ${{ steps.w07.outcome }}
          W08_RESULT: ${{ steps.w08.outcome }}
          W09_RESULT: ${{ steps.w09.outcome }}
          W13_RESULT: ${{ steps.w13.outcome }}
        run: |
          printf 'W07=%s W08=%s W09=%s W13=%s\n' "$W07_RESULT" "$W08_RESULT" "$W09_RESULT" "$W13_RESULT"
          test "$W07_RESULT" = "success"
          test "$W08_RESULT" = "success"
          test "$W09_RESULT" = "success"
          test "$W13_RESULT" = "success"
      - name: Application logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=120 web mcp keycloak db-init
      - name: Release evidence gate
        if: always()
        run: python scripts/verify_release.py
      - name: Copy results from ephemeral containers
        if: always()
        continue-on-error: true
        run: docker compose cp web:/code/evals/results ./live-results
      - name: Upload evaluation reports (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acme-live-evaluation
          path: live-results/
          if-no-files-found: ignore
      - name: Runtime service status
        if: always()
        run: docker compose ps
      - name: Tear down temporary stack
        if: always()
        run: docker compose down -v --remove-orphans
